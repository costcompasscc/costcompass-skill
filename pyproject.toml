[project]
name = "costcompass-cli"
version = "1.1.0"
description = "CostCompass command-line client — month-to-date spend and refresh."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=42",
    "keyring>=25",  # OS credential store: Keychain / Credential Manager / Secret Service
]

[project.scripts]
costcompass = "costcompass.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jwcrypto>=1.5",  # cross-impl JWE vector check only (not a runtime dep)
    # Pinned exactly, not floated: `ruff format` output changes between releases,
    # so a floating range makes `make fmt-check` report drift that exists only on
    # whichever machine resolved a newer ruff. This pin tracks the monorepo's
    # backend/requirements-dev.txt — the two trees are formatted by one version so
    # code moving between them never churns.
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costcompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
