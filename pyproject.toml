[project]
name = "costcompass-cli"
version = "1.0.0"
description = "CostCompass command-line client — month-to-date spend and refresh."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=42",
    "keyring>=25",  # OS credential store: Keychain / Credential Manager / Secret Service
]

[project.scripts]
costcompass = "costcompass.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jwcrypto>=1.5",  # cross-impl JWE vector check only (not a runtime dep)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costcompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
